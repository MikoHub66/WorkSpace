<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sheseating Map</title>
<meta name="description" content="A map of must-try restaurants featured by She's Eating It on Facebook, Instagram and TikTok.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8D%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F4F6F1;
    --surface:#FFFFFF;
    --ink:#1B201A;
    --muted:#6C7568;
    --border:#DFE3D8;
    --accent:#FF5A36;
    --accent-ink:#7A2412;
    --pine:#2F6F5E;
    --fb:#1877F2;
    --ig:#C13584;
    --tt:#111111;
    --shadow: 0 8px 24px rgba(27,32,26,0.16);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12140F;
      --surface:#1B1F17;
      --ink:#EDEFE8;
      --muted:#9CA491;
      --border:#2B3025;
      --shadow: 0 8px 28px rgba(0,0,0,0.45);
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Work Sans', system-ui, sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    flex-direction:column;
  }
  header{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 18px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    z-index:1000;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
    flex:1 1 auto;
    min-width:200px;
  }
  h1{
    font-family:'Fraunces', Georgia, serif;
    font-weight:700;
    font-size:1.35rem;
    margin:0;
    letter-spacing:-0.01em;
  }
  .tagline{
    font-size:0.85rem;
    color:var(--muted);
  }
  #count{
    font-size:0.8rem;
    color:var(--muted);
    background:var(--bg);
    border:1px solid var(--border);
    padding:5px 10px;
    border-radius:999px;
    white-space:nowrap;
  }
  .legend{
    display:flex;
    gap:12px;
    font-size:0.75rem;
    color:var(--muted);
    align-items:center;
  }
  .legend span{display:flex;align-items:center;gap:5px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  main{position:relative;flex:1 1 auto;min-height:0;}
  #map{position:absolute;inset:0;background:var(--bg);}
  #banner{
    position:absolute;
    top:10px;left:50%;
    transform:translateX(-50%);
    z-index:900;
    background:var(--surface);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    color:var(--muted);
    font-size:0.78rem;
    padding:6px 14px;
    border-radius:999px;
    display:none;
  }
  #banner.show{display:block;}

  .pin{position:relative;}
  .pin-circle{
    border-radius:50%;
    background-size:cover;background-position:center;
    border:3px solid var(--accent);
    box-shadow:var(--shadow);
    background-color:var(--surface);
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);
  }
  .pin-circle svg{width:55%;height:55%;}
  .pin-tail{
    width:0;height:0;margin:-3px auto 0;
    border-left:solid transparent;
    border-right:solid transparent;
    border-top:solid var(--accent);
  }
  .pin.fb .pin-circle,.pin.fb .pin-tail{border-color:var(--fb);}
  .pin.fb .pin-tail{border-top-color:var(--fb);}
  .pin.ig .pin-circle,.pin.ig .pin-tail{border-color:var(--ig);}
  .pin.ig .pin-tail{border-top-color:var(--ig);}
  .pin.tt .pin-circle,.pin.tt .pin-tail{border-color:var(--tt);}
  .pin.tt .pin-tail{border-top-color:var(--tt);}

  .leaflet-popup-content-wrapper{
    background:var(--surface);
    color:var(--ink);
    border-radius:12px;
    box-shadow:var(--shadow);
  }
  .leaflet-popup-tip{background:var(--surface);}
  .popup{font-family:'Work Sans',sans-serif;min-width:220px;}
  .popup h2{
    font-family:'Fraunces',serif;
    font-size:1.05rem;
    margin:0 0 2px;
  }
  .badge{
    display:inline-block;
    font-size:0.68rem;
    font-weight:600;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:2px 7px;
    border-radius:5px;
    color:#fff;
    margin:0 5px 6px 0;
  }
  .badge.fb{background:var(--fb);}
  .badge.ig{background:var(--ig);}
  .badge.tt{background:var(--tt);}
  .popup .date{color:var(--muted);font-size:0.78rem;margin-bottom:8px;}
  .popup blockquote{
    margin:0 0 10px;
    padding:8px 10px;
    background:var(--bg);
    border-left:3px solid var(--accent);
    font-style:italic;
    font-size:0.86rem;
    border-radius:0 6px 6px 0;
  }
  .popup .links{display:flex;flex-wrap:wrap;gap:6px;}
  .popup .links a{
    font-size:0.78rem;
    font-weight:500;
    text-decoration:none;
    color:var(--accent-ink);
    background:var(--bg);
    border:1px solid var(--border);
    padding:5px 9px;
    border-radius:7px;
  }
  .popup .links a:hover{border-color:var(--accent);}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>📍 She's Eating It</h1>
    <span class="tagline">Must-try spots, mapped</span>
  </div>
  <div class="legend">
    <span><span class="dot" style="background:var(--fb)"></span>Facebook</span>
    <span><span class="dot" style="background:var(--ig)"></span>Instagram</span>
    <span><span class="dot" style="background:var(--tt)"></span>TikTok</span>
  </div>
  <div id="count">— restaurants</div>
</header>

<main>
  <div id="map"></div>
  <div id="banner"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  var map = L.map('map', { zoomControl: true }).setView([39.5, -98.35], 4);

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community',
    maxZoom: 19
  }).addTo(map);

  // Esri "Imagery Hybrid": transparent reference overlays for roads and state/place boundaries + labels
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Roads &copy; Esri',
    maxZoom: 19
  }).addTo(map);

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Boundaries &amp; Places &copy; Esri',
    maxZoom: 19
  }).addTo(map);

  function platformClass(p){
    p = (p||'').toLowerCase();
    if (p.indexOf('face') === 0 || p === 'fb') return 'fb';
    if (p.indexOf('insta') === 0 || p === 'ig') return 'ig';
    if (p.indexOf('tik') === 0 || p === 'tt') return 'tt';
    return 'fb';
  }
  function platformLabel(cls){
    return { fb: 'Facebook', ig: 'Instagram', tt: 'TikTok' }[cls] || cls;
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fmtDate(d){
    if (!d) return '';
    var dt = new Date(d);
    if (isNaN(dt)) return esc(d);
    return dt.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
  }

  // Shown in the pin circle when a video has no thumbnail image
  var FORK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round">' +
    '<line x1="6" y1="2" x2="6" y2="9"/><line x1="10" y1="2" x2="10" y2="9"/>' +
    '<line x1="14" y1="2" x2="14" y2="9"/><line x1="18" y1="2" x2="18" y2="9"/>' +
    '<path d="M6 9c0 3 12 3 12 0"/><line x1="12" y1="10" x2="12" y2="22"/>' +
    '</svg>';

  // Newer videos get a bigger pin so the most recent visits stand out on the map
  var MIN_CIRCLE = 30, MAX_CIRCLE = 56;

  function sizeForRank(rank){
    // rank: 0 = oldest, 1 = newest
    var circle = Math.round(MIN_CIRCLE + (MAX_CIRCLE - MIN_CIRCLE) * rank);
    var tailHalf = Math.round(circle * 0.16);
    var tailHeight = Math.round(circle * 0.25);
    return { circle: circle, tailHalf: tailHalf, tailHeight: tailHeight };
  }

  function makeIcon(entry, cls, rank){
    var s = sizeForRank(rank);
    var img = entry.thumbnailUrl
      ? 'background-image:url(\'' + entry.thumbnailUrl.replace(/'/g,"%27") + '\')'
      : '';
    var fallback = entry.thumbnailUrl ? '' : FORK_ICON;
    var circleStyle = img + ';width:' + s.circle + 'px;height:' + s.circle + 'px';
    var tailStyle = 'border-left-width:' + s.tailHalf + 'px;border-right-width:' + s.tailHalf + 'px;border-top-width:' + s.tailHeight + 'px';
    var totalWidth = s.circle + 2, totalHeight = s.circle + s.tailHeight + 3;
    return L.divIcon({
      className: 'pin ' + cls,
      html: '<div class="pin-circle" style="' + circleStyle + '">' + fallback + '</div><div class="pin-tail" style="' + tailStyle + '"></div>',
      iconSize: [totalWidth, totalHeight],
      iconAnchor: [totalWidth / 2, totalHeight],
      popupAnchor: [0, -totalHeight + 2]
    });
  }

  function popupHtml(entry, cls){
    var links = '';
    if (entry.website) links += '<a href="' + esc(entry.website) + '" target="_blank" rel="noopener">Website</a>';
    if (entry.menuUrl) links += '<a href="' + esc(entry.menuUrl) + '" target="_blank" rel="noopener">Menu</a>';
    if (entry.yelpUrl) links += '<a href="' + esc(entry.yelpUrl) + '" target="_blank" rel="noopener">Yelp</a>';
    if (typeof entry.lat === 'number' && typeof entry.lng === 'number') {
      links += '<a href="https://www.google.com/maps/dir/?api=1&destination=' + entry.lat + ',' + entry.lng +
        '" target="_blank" rel="noopener">Directions</a>';
    }
    var searchQuery = entry.restaurantName + (entry.location ? ' ' + entry.location : '');
    links += '<a href="https://www.google.com/search?q=' + encodeURIComponent(searchQuery) +
      '" target="_blank" rel="noopener">Google search</a>';

    var videos = Array.isArray(entry.videos) && entry.videos.length
      ? entry.videos
      : (entry.videoUrl ? [{ platform: entry.platform, videoUrl: entry.videoUrl }] : []);
    videos.forEach(function(v){
      if (!v.videoUrl) return;
      links += '<a href="' + esc(v.videoUrl) + '" target="_blank" rel="noopener">Watch on ' +
        esc(platformLabel(platformClass(v.platform))) + '</a>';
    });

    var badges = videos.length
      ? videos.reduce(function(acc, v){
          var c = platformClass(v.platform);
          if (acc.indexOf(c) === -1) acc.push(c);
          return acc;
        }, [])
      : [cls];

    return '' +
      '<div class="popup">' +
        badges.map(function(b){ return '<span class="badge ' + b + '">' + platformLabel(b) + '</span>'; }).join(' ') +
        '<h2>' + esc(entry.restaurantName) + '</h2>' +
        '<div class="date">' + esc(fmtDate(entry.date)) + (entry.location ? ' · ' + esc(entry.location) : '') + '</div>' +
        (entry.quote ? '<blockquote>&ldquo;' + esc(entry.quote) + '&rdquo;</blockquote>' : '') +
        '<div class="links">' + links + '</div>' +
      '</div>';
  }

  function render(entries, isExample){
    var count = document.getElementById('count');
    var banner = document.getElementById('banner');
    count.textContent = entries.length + (entries.length === 1 ? ' restaurant' : ' restaurants');
    if (isExample){
      banner.textContent = 'Showing example pins — real spots appear here once the n8n workflow runs.';
      banner.classList.add('show');
    }

    var plottable = entries.filter(function(e){
      return typeof e.lat === 'number' && typeof e.lng === 'number';
    });

    var times = plottable
      .map(function(e){ return new Date(e.date).getTime(); })
      .filter(function(t){ return !isNaN(t); });
    var minTime = times.length ? Math.min.apply(null, times) : 0;
    var maxTime = times.length ? Math.max.apply(null, times) : 0;
    var spread = maxTime - minTime;

    // Oldest first, so newer (bigger) pins draw on top when they overlap
    plottable.sort(function(a, b){
      return new Date(a.date).getTime() - new Date(b.date).getTime();
    });

    var bounds = [];
    plottable.forEach(function(entry){
      var t = new Date(entry.date).getTime();
      var rank = (!isNaN(t) && spread > 0) ? (t - minTime) / spread : 1;
      var cls = platformClass(entry.platform);
      var marker = L.marker([entry.lat, entry.lng], { icon: makeIcon(entry, cls, rank) }).addTo(map);
      marker.bindPopup(popupHtml(entry, cls));
      bounds.push([entry.lat, entry.lng]);
    });
    if (bounds.length) map.fitBounds(bounds, { padding: [60, 60], maxZoom: 12 });
  }

  var EXAMPLE_DATA = [
    {
      restaurantName: "Example — Crab Shack Co.",
      platform: "instagram",
      lat: 25.7743, lng: -80.1937,
      location: "Miami, FL",
      website: "https://example.com",
      menuUrl: "https://example.com/menu",
      yelpUrl: "https://www.yelp.com/",
      videoUrl: "https://www.instagram.com/sheseatingit/",
      date: "2026-08-02",
      quote: "The garlic butter crab boil is non-negotiable.",
      thumbnailUrl: "https://picsum.photos/seed/crabshack/200/200"
    },
    {
      restaurantName: "Example — Nonna's Table",
      platform: "tiktok",
      lat: 40.7306, lng: -73.9866,
      location: "New York, NY",
      website: "https://example.com",
      yelpUrl: "https://www.yelp.com/",
      videoUrl: "https://www.tiktok.com/@sheseatingit",
      date: "2026-07-18",
      quote: "Get the truffle cacio e pepe, it's the best on the block.",
      thumbnailUrl: "https://picsum.photos/seed/nonnastable/200/200",
      videos: [
        {
          platform: "tiktok",
          videoUrl: "https://www.tiktok.com/@sheseatingit",
          date: "2026-07-18",
          quote: "Get the truffle cacio e pepe, it's the best on the block."
        },
        {
          platform: "instagram",
          videoUrl: "https://www.instagram.com/sheseatingit/",
          date: "2026-05-02",
          quote: "Back for round two — still the best pasta in the neighborhood."
        }
      ]
    }
  ];

  fetch('data.json', { cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error('no data.json yet'); return r.json(); })
    .then(function(data){
      if (Array.isArray(data) && data.length) render(data, false);
      else render(EXAMPLE_DATA, true);
    })
    .catch(function(){ render(EXAMPLE_DATA, true); });
})();
</script>
</body>
</html>
