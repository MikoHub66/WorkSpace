<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sheseating Map</title>
<meta name="description" content="A map of must-try restaurants featured by She's Eating It on Facebook, Instagram and TikTok.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8D%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F4F6F1;
    --surface:#FFFFFF;
    --ink:#1B201A;
    --muted:#6C7568;
    --border:#DFE3D8;
    --accent:#FF5A36;
    --accent-ink:#7A2412;
    --pine:#2F6F5E;
    --fb:#1877F2;
    --ig:#C13584;
    --tt:#111111;
    --shadow: 0 8px 24px rgba(27,32,26,0.16);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12140F;
      --surface:#1B1F17;
      --ink:#EDEFE8;
      --muted:#9CA491;
      --border:#2B3025;
      --shadow: 0 8px 28px rgba(0,0,0,0.45);
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Work Sans', system-ui, sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    flex-direction:column;
  }
  header{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 18px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    z-index:1000;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
    flex:1 1 auto;
    min-width:200px;
  }
  h1{
    font-family:'Fraunces', Georgia, serif;
    font-weight:700;
    font-size:1.35rem;
    margin:0;
    letter-spacing:-0.01em;
  }
  .tagline{
    font-size:0.85rem;
    color:var(--muted);
  }
  #count{
    font-size:0.8rem;
    color:var(--muted);
    background:var(--bg);
    border:1px solid var(--border);
    padding:5px 10px;
    border-radius:999px;
    white-space:nowrap;
  }
  .legend{
    display:flex;
    gap:12px;
    font-size:0.75rem;
    color:var(--muted);
    align-items:center;
  }
  .legend span{display:flex;align-items:center;gap:5px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  main{flex:1 1 auto;min-height:0;display:flex;overflow:hidden;}
  #sidebar{
    width:300px;flex:0 0 300px;overflow-y:auto;
    background:var(--surface);border-right:1px solid var(--border);
  }
  #sidebar .hint{padding:12px 14px;font-size:0.78rem;color:var(--muted);}
  .list-item{
    display:flex;gap:10px;padding:10px 14px;cursor:pointer;
    border-bottom:1px solid var(--border);
    transition:background 0.15s;
  }
  .list-item:hover,.list-item.active{background:var(--bg);}
  .li-thumb{
    width:44px;height:44px;border-radius:8px;flex:0 0 44px;
    background-size:cover;background-position:center;background-color:var(--bg);
    display:flex;align-items:center;justify-content:center;color:var(--muted);
    border:1px solid var(--border);
  }
  .li-thumb svg{width:50%;height:50%;}
  .li-info{min-width:0;flex:1 1 auto;}
  .li-badges{display:flex;gap:4px;margin-bottom:2px;}
  .li-badges .dot{width:7px;height:7px;}
  .li-name{font-weight:600;font-size:0.86rem;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .li-date{font-size:0.72rem;color:var(--muted);margin-bottom:4px;}
  .li-watch{display:flex;gap:6px;}
  .li-watch a{color:var(--muted);font-size:0.85rem;}
  .li-watch a:hover{color:var(--accent-ink);}
  @media (max-width:760px){
    main{flex-direction:column;}
    #sidebar{width:100%;flex:0 0 auto;max-height:32vh;border-right:none;border-bottom:1px solid var(--border);}
  }
  #mapWrap{position:relative;flex:1 1 auto;min-height:0;}
  #map{position:absolute;inset:0;background:var(--bg);}
  #banner{
    position:absolute;
    top:10px;left:50%;
    transform:translateX(-50%);
    z-index:900;
    background:var(--surface);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    color:var(--muted);
    font-size:0.78rem;
    padding:6px 14px;
    border-radius:999px;
    display:none;
  }
  #banner.show{display:block;}

  .pin{position:relative;}
  .pin-circle{
    border-radius:50%;
    background-size:cover;background-position:center;
    border:3px solid var(--accent);
    box-shadow:var(--shadow);
    background-color:var(--surface);
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);
    transition:transform 0.15s,box-shadow 0.15s;
    transform-origin:center bottom;
  }
  .pin.highlighted{z-index:1000 !important;}
  .pin.highlighted .pin-circle{
    transform:scale(1.18);
    box-shadow:0 0 0 4px var(--accent),var(--shadow);
  }
  .pin-circle svg{width:55%;height:55%;}
  .pin-tail{
    width:0;height:0;margin:-3px auto 0;
    border-left:solid transparent;
    border-right:solid transparent;
    border-top:solid var(--accent);
  }
  .pin.fb .pin-circle,.pin.fb .pin-tail{border-color:var(--fb);}
  .pin.fb .pin-tail{border-top-color:var(--fb);}
  .pin.ig .pin-circle,.pin.ig .pin-tail{border-color:var(--ig);}
  .pin.ig .pin-tail{border-top-color:var(--ig);}
  .pin.tt .pin-circle,.pin.tt .pin-tail{border-color:var(--tt);}
  .pin.tt .pin-tail{border-top-color:var(--tt);}
  .pin.multi .pin-circle,.pin.multi .pin-tail{border-color:var(--pine);}
  .pin.multi .pin-tail{border-top-color:var(--pine);}

  .leaflet-popup-content-wrapper{
    background:var(--surface);
    color:var(--ink);
    border-radius:12px;
    box-shadow:var(--shadow);
  }
  .leaflet-popup-tip{background:var(--surface);}
  .popup{font-family:'Work Sans',sans-serif;min-width:220px;}
  .popup h2{
    font-family:'Fraunces',serif;
    font-size:1.05rem;
    margin:0 0 2px;
  }
  .badge{
    display:inline-block;
    font-size:0.68rem;
    font-weight:600;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:2px 7px;
    border-radius:5px;
    color:#fff;
    margin:0 5px 6px 0;
  }
  .badge.fb{background:var(--fb);}
  .badge.ig{background:var(--ig);}
  .badge.tt{background:var(--tt);}
  .popup .date{color:var(--muted);font-size:0.78rem;margin-bottom:8px;}
  .popup blockquote{
    margin:0 0 10px;
    padding:8px 10px;
    background:var(--bg);
    border-left:3px solid var(--accent);
    font-style:italic;
    font-size:0.86rem;
    border-radius:0 6px 6px 0;
  }
  .popup .links{display:flex;flex-wrap:wrap;gap:6px;}
  .popup .links + .watch-label{margin-top:10px;}
  .popup .watch-label{
    font-size:0.72rem;font-weight:600;color:var(--muted);
    text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;
  }
  .popup .links a{
    font-size:0.78rem;
    font-weight:500;
    text-decoration:none;
    color:var(--accent-ink);
    background:var(--bg);
    border:1px solid var(--border);
    padding:5px 9px;
    border-radius:7px;
  }
  .popup .links a:hover{border-color:var(--accent);}
  .popup .links a.icon-link{
    display:flex;align-items:center;justify-content:center;
    width:30px;height:30px;padding:0;font-size:15px;
  }
  .popup .links a.icon-link.tiktok{color:#111;}
  .popup .links a.icon-link.facebook{color:#1877F2;}
  .popup .links a.icon-link.instagram{color:#C13584;}
  .popup .links a.icon-link.yelp{color:#D32323;}
  .popup .links a.icon-link.directions{color:var(--pine);}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>📍 She's Eating It</h1>
    <span class="tagline">Must-try spots, mapped</span>
  </div>
  <div class="legend">
    <span><span class="dot" style="background:var(--fb)"></span>Facebook</span>
    <span><span class="dot" style="background:var(--ig)"></span>Instagram</span>
    <span><span class="dot" style="background:var(--tt)"></span>TikTok</span>
    <span><span class="dot" style="background:var(--pine)"></span>Multiple platforms</span>
  </div>
  <div id="count">— restaurants</div>
</header>

<main>
  <div id="sidebar"><div class="hint">Loading…</div></div>
  <div id="mapWrap">
    <div id="map"></div>
    <div id="banner"></div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  var map = L.map('map', { zoomControl: true }).setView([39.5, -98.35], 4);

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community',
    maxZoom: 19
  }).addTo(map);

  // Esri "Imagery Hybrid": transparent reference overlays for roads and state/place boundaries + labels
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Roads &copy; Esri',
    maxZoom: 19
  }).addTo(map);

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Boundaries &amp; Places &copy; Esri',
    maxZoom: 19
  }).addTo(map);

  function platformClass(p){
    p = (p||'').toLowerCase();
    if (p.indexOf('face') === 0 || p === 'fb') return 'fb';
    if (p.indexOf('insta') === 0 || p === 'ig') return 'ig';
    if (p.indexOf('tik') === 0 || p === 'tt') return 'tt';
    return 'fb';
  }
  function pinClass(entry){
    var videos = Array.isArray(entry.videos) ? entry.videos : [];
    var distinct = videos.reduce(function(acc, v){
      var c = platformClass(v.platform);
      if (acc.indexOf(c) === -1) acc.push(c);
      return acc;
    }, []);
    if (distinct.length > 1) return 'multi';
    return platformClass(entry.platform);
  }
  function platformLabel(cls){
    return { fb: 'Facebook', ig: 'Instagram', tt: 'TikTok', multi: 'Multiple platforms' }[cls] || cls;
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fmtDate(d){
    if (!d) return '';
    var dt = new Date(d);
    if (isNaN(dt)) return esc(d);
    return dt.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
  }

  // Shown in the pin circle when a video has no thumbnail image
  var FORK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round">' +
    '<line x1="6" y1="2" x2="6" y2="9"/><line x1="10" y1="2" x2="10" y2="9"/>' +
    '<line x1="14" y1="2" x2="14" y2="9"/><line x1="18" y1="2" x2="18" y2="9"/>' +
    '<path d="M6 9c0 3 12 3 12 0"/><line x1="12" y1="10" x2="12" y2="22"/>' +
    '</svg>';

  // Newer videos get a bigger pin so the most recent visits stand out on the map
  var MIN_CIRCLE = 30, MAX_CIRCLE = 56;

  function sizeForRank(rank){
    // rank: 0 = oldest, 1 = newest
    var circle = Math.round(MIN_CIRCLE + (MAX_CIRCLE - MIN_CIRCLE) * rank);
    var tailHalf = Math.round(circle * 0.16);
    var tailHeight = Math.round(circle * 0.25);
    return { circle: circle, tailHalf: tailHalf, tailHeight: tailHeight };
  }

  function makeIcon(entry, cls, rank){
    var s = sizeForRank(rank);
    var img = entry.thumbnailUrl
      ? 'background-image:url(\'' + entry.thumbnailUrl.replace(/'/g,"%27") + '\')'
      : '';
    var fallback = entry.thumbnailUrl ? '' : FORK_ICON;
    var circleStyle = img + ';width:' + s.circle + 'px;height:' + s.circle + 'px';
    var tailStyle = 'border-left-width:' + s.tailHalf + 'px;border-right-width:' + s.tailHalf + 'px;border-top-width:' + s.tailHeight + 'px';
    var totalWidth = s.circle + 2, totalHeight = s.circle + s.tailHeight + 3;
    return L.divIcon({
      className: 'pin ' + cls,
      html: '<div class="pin-circle" style="' + circleStyle + '">' + fallback + '</div><div class="pin-tail" style="' + tailStyle + '"></div>',
      iconSize: [totalWidth, totalHeight],
      iconAnchor: [totalWidth / 2, totalHeight],
      popupAnchor: [0, -totalHeight + 2]
    });
  }

  function platformIcon(cls){
    return {
      fb: { fa: 'fa-brands fa-facebook', mod: 'facebook' },
      ig: { fa: 'fa-brands fa-instagram', mod: 'instagram' },
      tt: { fa: 'fa-brands fa-tiktok', mod: 'tiktok' }
    }[cls] || { fa: 'fa-solid fa-video', mod: '' };
  }

  function iconLink(href, faClass, modClass, label){
    return '<a class="icon-link ' + modClass + '" href="' + esc(href) + '" target="_blank" rel="noopener" ' +
      'title="' + esc(label) + '" aria-label="' + esc(label) + '"><i class="' + faClass + '" aria-hidden="true"></i></a>';
  }

  function entryVideos(entry){
    return Array.isArray(entry.videos) && entry.videos.length
      ? entry.videos
      : (entry.videoUrl ? [{ platform: entry.platform, videoUrl: entry.videoUrl }] : []);
  }

  function buildWatchLinks(entry){
    var out = '';
    entryVideos(entry).forEach(function(v){
      if (!v.videoUrl) return;
      var vCls = platformClass(v.platform);
      var icon = platformIcon(vCls);
      out += iconLink(v.videoUrl, icon.fa, icon.mod, 'Watch on ' + platformLabel(vCls));
    });
    return out;
  }

  function popupHtml(entry, cls){
    var links = '';
    if (entry.website) links += '<a href="' + esc(entry.website) + '" target="_blank" rel="noopener">Website</a>';
    if (entry.menuUrl) links += '<a href="' + esc(entry.menuUrl) + '" target="_blank" rel="noopener">Menu</a>';
    if (entry.yelpUrl) links += iconLink(entry.yelpUrl, 'fa-brands fa-yelp', 'yelp', 'Yelp page');
    if (typeof entry.lat === 'number' && typeof entry.lng === 'number') {
      links += iconLink(
        'https://www.google.com/maps/dir/?api=1&destination=' + entry.lat + ',' + entry.lng,
        'fa-solid fa-diamond-turn-right', 'directions', 'Get directions'
      );
    }
    var searchQuery = entry.restaurantName + (entry.location ? ' ' + entry.location : '');
    links += '<a href="https://www.google.com/search?q=' + encodeURIComponent(searchQuery) +
      '" target="_blank" rel="noopener">Google search</a>';

    var videos = entryVideos(entry);
    var watchLinks = buildWatchLinks(entry);

    var badges = videos.length
      ? videos.reduce(function(acc, v){
          var c = platformClass(v.platform);
          if (acc.indexOf(c) === -1) acc.push(c);
          return acc;
        }, [])
      : [cls];

    return '' +
      '<div class="popup">' +
        badges.map(function(b){ return '<span class="badge ' + b + '">' + platformLabel(b) + '</span>'; }).join(' ') +
        '<h2>' + esc(entry.restaurantName) + '</h2>' +
        '<div class="date">' + esc(fmtDate(entry.date)) + (entry.location ? ' · ' + esc(entry.location) : '') + '</div>' +
        (entry.quote ? '<blockquote>&ldquo;' + esc(entry.quote) + '&rdquo;</blockquote>' : '') +
        '<div class="links">' + links + '</div>' +
        (watchLinks ? '<div class="watch-label">Watch it now:</div><div class="links">' + watchLinks + '</div>' : '') +
      '</div>';
  }

  function render(entries, isExample){
    var count = document.getElementById('count');
    var banner = document.getElementById('banner');
    count.textContent = entries.length + (entries.length === 1 ? ' restaurant' : ' restaurants');
    if (isExample){
      banner.textContent = 'Showing example pins — real spots appear here once the n8n workflow runs.';
      banner.classList.add('show');
    }

    var plottable = entries.filter(function(e){
      return typeof e.lat === 'number' && typeof e.lng === 'number';
    });

    var times = plottable
      .map(function(e){ return new Date(e.date).getTime(); })
      .filter(function(t){ return !isNaN(t); });
    var minTime = times.length ? Math.min.apply(null, times) : 0;
    var maxTime = times.length ? Math.max.apply(null, times) : 0;
    var spread = maxTime - minTime;

    // Oldest first, so newer (bigger) pins draw on top when they overlap
    plottable.sort(function(a, b){
      return new Date(a.date).getTime() - new Date(b.date).getTime();
    });

    var bounds = [];
    plottable.forEach(function(entry){
      var t = new Date(entry.date).getTime();
      var rank = (!isNaN(t) && spread > 0) ? (t - minTime) / spread : 1;
      var cls = pinClass(entry);
      var marker = L.marker([entry.lat, entry.lng], { icon: makeIcon(entry, cls, rank) }).addTo(map);
      marker.bindPopup(popupHtml(entry, cls));
      entry.__marker = marker;
      bounds.push([entry.lat, entry.lng]);
    });
    if (bounds.length) map.fitBounds(bounds, { padding: [60, 60], maxZoom: 12 });

    renderSidebar(plottable);
  }

  var activeListItem = null;
  function setHighlight(entry, on){
    if (!entry || !entry.__marker) return;
    var el = entry.__marker.getElement();
    if (el) el.classList.toggle('highlighted', on);
  }

  function renderSidebar(plottable){
    var sidebar = document.getElementById('sidebar');
    sidebar.innerHTML = '';
    if (!plottable.length){
      sidebar.innerHTML = '<div class="hint">No spots plotted yet.</div>';
      return;
    }
    // Most recently featured first - natural reading order for a list
    var list = plottable.slice().sort(function(a, b){
      return new Date(b.date).getTime() - new Date(a.date).getTime();
    });
    list.forEach(function(entry){
      var cls = pinClass(entry);
      var item = document.createElement('div');
      item.className = 'list-item';
      var badges = entryVideos(entry).reduce(function(acc, v){
        var c = platformClass(v.platform);
        if (acc.indexOf(c) === -1) acc.push(c);
        return acc;
      }, []);
      if (!badges.length) badges = [cls];
      item.innerHTML =
        '<div class="li-thumb"' + (entry.thumbnailUrl ? ' style="background-image:url(\'' + entry.thumbnailUrl.replace(/'/g,"%27") + '\')"' : '') + '>' +
          (entry.thumbnailUrl ? '' : FORK_ICON) +
        '</div>' +
        '<div class="li-info">' +
          '<div class="li-badges">' + badges.map(function(b){ return '<span class="dot" style="background:var(--' + b + ')"></span>'; }).join('') + '</div>' +
          '<div class="li-name">' + esc(entry.restaurantName) + '</div>' +
          '<div class="li-date">' + esc(fmtDate(entry.date)) + (entry.location ? ' · ' + esc(entry.location) : '') + '</div>' +
          '<div class="li-watch">' + buildWatchLinks(entry) + '</div>' +
        '</div>';

      item.addEventListener('mouseenter', function(){ setHighlight(entry, true); });
      item.addEventListener('mouseleave', function(){ if (item !== activeListItem) setHighlight(entry, false); });
      item.addEventListener('click', function(e){
        if (e.target.closest('a')) return; // let watch-link clicks pass through normally
        if (activeListItem){ activeListItem.classList.remove('active'); }
        item.classList.add('active');
        activeListItem = item;
        if (entry.__marker){
          map.setView([entry.lat, entry.lng], Math.max(map.getZoom(), 14), { animate: true });
          entry.__marker.openPopup();
        }
      });
      sidebar.appendChild(item);
    });
  }

  var EXAMPLE_DATA = [
    {
      restaurantName: "Example — Crab Shack Co.",
      platform: "instagram",
      lat: 25.7743, lng: -80.1937,
      location: "Miami, FL",
      website: "https://example.com",
      menuUrl: "https://example.com/menu",
      yelpUrl: "https://www.yelp.com/",
      videoUrl: "https://www.instagram.com/sheseatingit/",
      date: "2026-08-02",
      quote: "The garlic butter crab boil is non-negotiable.",
      thumbnailUrl: "https://picsum.photos/seed/crabshack/200/200"
    },
    {
      restaurantName: "Example — Nonna's Table",
      platform: "tiktok",
      lat: 40.7306, lng: -73.9866,
      location: "New York, NY",
      website: "https://example.com",
      yelpUrl: "https://www.yelp.com/",
      videoUrl: "https://www.tiktok.com/@sheseatingit",
      date: "2026-07-18",
      quote: "Get the truffle cacio e pepe, it's the best on the block.",
      thumbnailUrl: "https://picsum.photos/seed/nonnastable/200/200",
      videos: [
        {
          platform: "tiktok",
          videoUrl: "https://www.tiktok.com/@sheseatingit",
          date: "2026-07-18",
          quote: "Get the truffle cacio e pepe, it's the best on the block."
        },
        {
          platform: "instagram",
          videoUrl: "https://www.instagram.com/sheseatingit/",
          date: "2026-05-02",
          quote: "Back for round two — still the best pasta in the neighborhood."
        }
      ]
    }
  ];

  fetch('data.json', { cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error('no data.json yet'); return r.json(); })
    .then(function(data){
      if (Array.isArray(data) && data.length) render(data, false);
      else render(EXAMPLE_DATA, true);
    })
    .catch(function(){ render(EXAMPLE_DATA, true); });
})();
</script>
</body>
</html>
