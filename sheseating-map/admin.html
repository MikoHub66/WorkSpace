<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheseating Admin Review</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F4F6F1; --surface:#FFFFFF; --ink:#1B201A; --muted:#6C7568;
    --border:#DFE3D8; --accent:#FF5A36; --accent-ink:#7A2412;
    --danger:#C0392B; --ok:#2F6F5E; --shadow:0 8px 24px rgba(27,32,26,0.12);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#12140F; --surface:#1B1F17; --ink:#EDEFE8; --muted:#9CA491; --border:#2B3025; --shadow:0 8px 28px rgba(0,0,0,0.45); }
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Work Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
  header{padding:18px 20px;border-bottom:1px solid var(--border);background:var(--surface);}
  h1{font-family:'Fraunces',Georgia,serif;font-size:1.3rem;margin:0 0 4px;}
  header p{margin:0;color:var(--muted);font-size:0.85rem;}
  main{max-width:820px;margin:0 auto;padding:24px 16px 60px;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;}
  .login-card{max-width:360px;margin:60px auto;padding:18px;}
  label{display:block;font-size:0.78rem;color:var(--muted);margin:12px 0 4px;}
  label:first-child{margin-top:0;}
  input, textarea{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;
    background:var(--bg);color:var(--ink);font-family:inherit;font-size:0.9rem;
  }
  textarea{min-height:64px;resize:vertical;}
  button{
    font-family:inherit;font-weight:600;font-size:0.88rem;cursor:pointer;
    border-radius:8px;border:1px solid transparent;padding:9px 16px;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:disabled{opacity:0.5;cursor:default;}
  .btn-ghost{background:transparent;border-color:var(--border);color:var(--ink);}
  #loginError{color:var(--danger);font-size:0.85rem;margin-top:10px;display:none;}

  .card-head{
    display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .card-head:hover{background:var(--bg);}
  .card-head img{width:38px;height:38px;border-radius:8px;object-fit:cover;background:var(--bg);flex:0 0 38px;}
  .card-head .name{font-weight:600;font-size:0.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card-head .name-wrap{min-width:0;flex:1 1 auto;}
  .card-head .sub{font-size:0.74rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chevron{transition:transform 0.15s;color:var(--muted);flex:0 0 auto;}
  .card.expanded .chevron{transform:rotate(90deg);}
  .card-body{display:none;padding:0 18px 18px;}
  .card.expanded .card-body{display:block;}
  .row-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-top:6px;border-top:1px solid var(--border);}
  .badge{font-size:0.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:5px;color:#fff;white-space:nowrap;}
  .badge.facebook{background:#1877F2;} .badge.instagram{background:#C13584;} .badge.tiktok{background:#111;} .badge.unknown{background:#888;}
  .badge.status{cursor:default;}
  .row-head a{font-size:0.8rem;color:var(--accent-ink);text-decoration:none;margin-left:auto;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
  @media (max-width:520px){ .grid{grid-template-columns:1fr;} }
  .actions{display:flex;gap:10px;align-items:center;margin-top:14px;}
  .status-msg{font-size:0.82rem;}
  .status-msg.ok{color:var(--ok);} .status-msg.err{color:var(--danger);}
  #empty, #loading{color:var(--muted);text-align:center;padding:40px 0;}
  #topBar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  #topBar h2{font-size:1rem;margin:0;}
  table.reviewTable{width:100%;border-collapse:collapse;font-size:0.85rem;background:var(--surface);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);}
  table.reviewTable th,table.reviewTable td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle;}
  table.reviewTable th{font-size:0.68rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);}
  table.reviewTable tr:last-child td{border-bottom:none;}
  table.reviewTable img{width:34px;height:34px;border-radius:6px;object-fit:cover;background:var(--bg);display:block;}
  table.reviewTable .btn-primary{padding:6px 10px;font-size:0.78rem;white-space:nowrap;}
  table.reviewTable input{width:130px;padding:5px 6px;font-size:0.78rem;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--ink);}
  table.reviewTable td{white-space:nowrap;}
  table.reviewTable td.muted-cell{color:var(--muted);text-align:center;}
</style>
</head>
<body>

<header>
  <h1>🔒 Sheseating Admin</h1>
  <p>Review new drafts and edit anything already live on the map. Not linked from the public map — nothing here loads without the review password.</p>
</header>

<main>
  <div class="card login-card" id="loginCard">
    <label for="user">Username</label>
    <input id="user" autocomplete="username">
    <label for="pass">Password</label>
    <input id="pass" type="password" autocomplete="current-password">
    <div class="actions" style="margin-top:16px;">
      <button class="btn-primary" id="loginBtn" style="width:100%;">Sign in</button>
    </div>
    <div id="loginError"></div>
  </div>

  <div id="appArea" style="display:none;">
    <div id="topBar">
      <h2 id="countLabel">Needs review</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-ghost" id="viewToggleBtn">Table view</button>
        <button class="btn-primary" id="approveAllBtn">Approve all pending</button>
        <button class="btn-ghost" id="refreshBtn">Refresh</button>
      </div>
    </div>
    <div id="bulkStatus" class="status-msg" style="margin-bottom:10px;"></div>
    <div id="loading" style="display:none;">Loading…</div>
    <div id="empty" style="display:none;">Nothing waiting for review right now.</div>
    <div id="list"></div>
    <div id="tableWrap" style="display:none;overflow-x:auto;"></div>
  </div>
</main>

<script>
(function(){
  // Cloudflare quick tunnel to n8n. This URL changes each time the tunnel is
  // restarted (a fresh cloudflared run = a new random subdomain) - update here
  // when that happens.
  var N8N_BASE = 'https://microphone-outside-hop-producer.trycloudflare.com';
  var LIST_URL = N8N_BASE + '/webhook/sheseating-review/list';
  var APPROVE_URL = N8N_BASE + '/webhook/sheseating-review/approve';

  var authHeader = null;
  var currentRows = [];
  var viewMode = 'cards';

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  document.getElementById('loginBtn').addEventListener('click', function(){
    var user = document.getElementById('user').value.trim();
    var pass = document.getElementById('pass').value;
    if (!user || !pass) return;
    authHeader = 'Basic ' + btoa(user + ':' + pass);
    loadList(true);
  });

  function showLoginError(msg){
    var el = document.getElementById('loginError');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function loadList(isFirstLoad){
    var loading = document.getElementById('loading');
    var empty = document.getElementById('empty');
    var list = document.getElementById('list');
    loading.style.display = 'block';
    empty.style.display = 'none';
    list.innerHTML = '';

    fetch(LIST_URL, { headers: { 'Authorization': authHeader } })
      .then(function(r){
        if (r.status === 401 || r.status === 403) throw new Error('AUTH');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(data){
        loading.style.display = 'none';
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('appArea').style.display = 'block';
        var rows = data.rows || [];
        // Needs-review rows first (the actual queue), published rows below (edit/fix anything already live)
        rows.sort(function(a, b){
          if (a.status === b.status) return 0;
          return a.status === 'needs_review' ? -1 : 1;
        });
        var needsReviewCount = rows.filter(function(r){ return r.status === 'needs_review'; }).length;
        var publishedCount = rows.length - needsReviewCount;
        document.getElementById('countLabel').textContent =
          needsReviewCount + (needsReviewCount === 1 ? ' needs review' : ' need review') +
          ' · ' + publishedCount + ' published';
        currentRows = rows;
        renderView();
      })
      .catch(function(err){
        loading.style.display = 'none';
        if (err.message === 'AUTH') {
          if (isFirstLoad) showLoginError('Wrong username or password.');
          else { authHeader = null; document.getElementById('appArea').style.display = 'none'; document.getElementById('loginCard').style.display = 'block'; }
        } else if (isFirstLoad) {
          showLoginError('Could not reach n8n (' + err.message + '). Is it running and is N8N_BASE correct in this page?');
        }
      });
  }

  document.getElementById('refreshBtn').addEventListener('click', function(){ loadList(false); });

  function submitApproval(payload){
    return fetch(APPROVE_URL, {
      method: 'POST',
      headers: { 'Authorization': authHeader, 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(body){ return { ok: !!(r.ok && body && body.ok), message: body && body.message }; }); })
      .catch(function(err){ return { ok: false, message: 'Request failed: ' + err.message }; });
  }

  function rowToPayload(row){
    return {
      id: row.id,
      restaurantName: row.restaurantName || '',
      normalizedLocation: row.normalizedLocation || row.locationHint || '',
      website: row.website || '',
      yelpUrl: row.yelpUrl || '',
      menuUrl: row.menuUrl || '',
      grubhubUrl: row.grubhubUrl || '',
      uberEatsUrl: row.uberEatsUrl || '',
      videoDate: row.videoDate || '',
      quote: row.quote || '',
      thumbnailUrl: row.thumbnailUrl || ''
    };
  }

  function renderView(){
    var list = document.getElementById('list');
    var tableWrap = document.getElementById('tableWrap');
    var empty = document.getElementById('empty');
    list.innerHTML = '';
    tableWrap.innerHTML = '';
    if (!currentRows.length){
      empty.style.display = 'block';
      list.style.display = 'none';
      tableWrap.style.display = 'none';
      return;
    }
    empty.style.display = 'none';
    if (viewMode === 'table'){
      list.style.display = 'none';
      tableWrap.style.display = 'block';
      tableWrap.appendChild(renderTable(currentRows));
    } else {
      tableWrap.style.display = 'none';
      list.style.display = 'block';
      currentRows.forEach(function(row){ list.appendChild(renderCard(row)); });
    }
  }

  function tinput(key, value, placeholder){
    return '<input data-field="' + key + '" value="' + esc(value || '') + '" placeholder="' + esc(placeholder || '') + '">';
  }

  var DEFAULT_PLATFORMS = ['facebook', 'tiktok', 'instagram'];

  function platformKey(p){
    p = (p || '').toLowerCase();
    if (p.indexOf('face') === 0 || p === 'fb') return 'facebook';
    if (p.indexOf('insta') === 0 || p === 'ig') return 'instagram';
    if (p.indexOf('tik') === 0 || p === 'tt') return 'tiktok';
    return p || 'other';
  }

  function platformColumnsForRows(rows){
    var seen = {};
    DEFAULT_PLATFORMS.forEach(function(p){ seen[p] = true; });
    rows.forEach(function(r){ seen[platformKey(r.platform)] = true; });
    return Object.keys(seen);
  }

  function groupKey(row){
    var name = (row.restaurantName || '').trim().toLowerCase();
    return name || ('__row_' + row.id);
  }

  function groupRows(rows){
    var map = {}, order = [];
    rows.forEach(function(row){
      var key = groupKey(row);
      if (!map[key]){ map[key] = []; order.push(key); }
      map[key].push(row);
    });
    return order.map(function(key){ return map[key]; });
  }

  function renderTable(rows){
    var groups = groupRows(rows);
    var platforms = platformColumnsForRows(rows);
    var table = document.createElement('table');
    table.className = 'reviewTable';
    var platformHeaders = platforms.map(function(p){
      return '<th>' + esc(p.charAt(0).toUpperCase() + p.slice(1)) + '</th>';
    }).join('');
    var head = '<thead><tr><th></th><th>Restaurant</th><th>Location</th><th>Website</th><th>Yelp</th><th>Menu</th><th>Grubhub</th><th>Uber Eats</th>' +
      platformHeaders + '<th>Status</th><th></th></tr></thead>';

    var body = '<tbody>' + groups.map(function(group){
      var primary = group.slice().sort(function(a, b){
        return new Date(b.videoDate).getTime() - new Date(a.videoDate).getTime();
      })[0];
      var allApproved = group.every(function(r){ return r.status === 'approved'; });
      var platformCells = platforms.map(function(p){
        var match = group.find(function(r){ return platformKey(r.platform) === p; });
        if (!match || !match.videoUrl) return '<td class="muted-cell">—</td>';
        return '<td><a href="' + esc(match.videoUrl) + '" target="_blank" rel="noopener">open</a></td>';
      }).join('');
      return '<tr>' +
        '<td>' + (primary.thumbnailUrl ? '<img src="' + esc(primary.thumbnailUrl) + '" alt="">' : '') + '</td>' +
        '<td>' + tinput('restaurantName', primary.restaurantName, 'name') + '</td>' +
        '<td>' + tinput('normalizedLocation', primary.normalizedLocation || primary.locationHint, 'city, state') + '</td>' +
        '<td>' + tinput('website', primary.website, 'website') + '</td>' +
        '<td>' + tinput('yelpUrl', primary.yelpUrl, 'yelp') + '</td>' +
        '<td>' + tinput('menuUrl', primary.menuUrl, 'menu') + '</td>' +
        '<td>' + tinput('grubhubUrl', primary.grubhubUrl, 'grubhub') + '</td>' +
        '<td>' + tinput('uberEatsUrl', primary.uberEatsUrl, 'uber eats') + '</td>' +
        platformCells +
        '<td class="statusCell"><span class="badge status" style="background:' + (allApproved ? 'var(--ok)' : 'var(--accent)') + '">' + (allApproved ? 'Published' : 'Needs review') + '</span></td>' +
        '<td><button class="btn-primary" data-action="tableApprove">' + (allApproved ? 'Save' : 'Approve') + '</button></td>' +
      '</tr>';
    }).join('') + '</tbody>';
    table.innerHTML = head + body;

    var trs = table.querySelectorAll('tbody tr');
    trs.forEach(function(tr, i){
      var group = groups[i];
      var btn = tr.querySelector('[data-action="tableApprove"]');
      var wasAllApproved = group.every(function(r){ return r.status === 'approved'; });
      btn.addEventListener('click', function(){
        var shared = {};
        tr.querySelectorAll('[data-field]').forEach(function(el){
          shared[el.getAttribute('data-field')] = el.value;
        });
        btn.disabled = true;
        btn.textContent = '…';
        Promise.all(group.map(function(row){
          var payload = Object.assign(rowToPayload(row), shared, { id: row.id });
          return submitApproval(payload);
        })).then(function(results){
          btn.disabled = false;
          var allOk = results.every(function(r){ return r.ok; });
          if (allOk){
            tr.querySelector('.statusCell').innerHTML = '<span class="badge status" style="background:var(--ok)">Published</span>';
            btn.textContent = 'Save';
          } else {
            btn.textContent = wasAllApproved ? 'Save' : 'Approve';
            alert('Some videos in this group failed to save for ' + (group[0].restaurantName || 'this restaurant') + ' — check the details and try again.');
          }
        });
      });
    });
    return table;
  }

  document.getElementById('viewToggleBtn').addEventListener('click', function(){
    viewMode = (viewMode === 'cards') ? 'table' : 'cards';
    document.getElementById('viewToggleBtn').textContent = (viewMode === 'cards') ? 'Table view' : 'Card view';
    renderView();
  });

  document.getElementById('approveAllBtn').addEventListener('click', function(){
    var pending = currentRows.filter(function(r){ return r.status === 'needs_review'; });
    var bulkStatus = document.getElementById('bulkStatus');
    if (!pending.length){
      bulkStatus.className = 'status-msg';
      bulkStatus.textContent = 'Nothing pending to approve.';
      return;
    }
    if (!confirm('Publish all ' + pending.length + ' pending item(s) to the live map as-is?')) return;
    var btn = document.getElementById('approveAllBtn');
    btn.disabled = true;
    var done = 0, failed = [];
    function next(i){
      if (i >= pending.length){
        btn.disabled = false;
        bulkStatus.className = failed.length ? 'status-msg err' : 'status-msg ok';
        bulkStatus.textContent = failed.length
          ? ('Approved ' + done + ' of ' + pending.length + '. Failed: ' + failed.join(', '))
          : ('Approved all ' + done + ' pending item(s).');
        loadList(false);
        return;
      }
      var row = pending[i];
      bulkStatus.className = 'status-msg';
      bulkStatus.textContent = 'Approving ' + (i + 1) + ' of ' + pending.length + '…';
      submitApproval(rowToPayload(row)).then(function(res){
        if (res.ok) done++; else failed.push(row.restaurantName || ('#' + row.id));
        next(i + 1);
      });
    }
    next(0);
  });

  function field(labelText, key, value, type){
    return '<div>' +
      '<label>' + esc(labelText) + '</label>' +
      (type === 'textarea'
        ? '<textarea data-field="' + key + '">' + esc(value) + '</textarea>'
        : '<input data-field="' + key + '" value="' + esc(value) + '">') +
      '</div>';
  }

  function renderCard(row){
    var card = document.createElement('div');
    card.className = 'card';
    var platformCls = (row.platform || 'unknown').toLowerCase();
    var isPublished = row.status === 'approved';
    var statusColor = isPublished ? 'var(--ok)' : 'var(--accent)';
    var statusLabel = isPublished ? 'Published — click to edit' : 'Needs review — click to edit';

    card.innerHTML =
      '<div class="card-head" data-action="toggle">' +
        (row.thumbnailUrl ? '<img src="' + esc(row.thumbnailUrl) + '" alt="">' : '') +
        '<div class="name-wrap">' +
          '<div class="name">' + esc(row.restaurantName || '(no name yet)') + '</div>' +
          '<div class="sub">' + esc(fmtDate(row.videoDate)) + (row.normalizedLocation ? ' · ' + esc(row.normalizedLocation) : '') + '</div>' +
        '</div>' +
        '<span class="badge ' + esc(platformCls) + '">' + esc(platformCls) + '</span>' +
        '<span class="badge status" style="background:' + statusColor + '" title="' + esc(statusLabel) + '">' +
          (isPublished ? 'Published' : 'Needs review') +
        '</span>' +
        '<svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="row-head">' +
          '<a href="' + esc(row.videoUrl || '') + '" target="_blank" rel="noopener">Watch video ↗</a>' +
          '<input type="hidden" data-field="thumbnailUrl" value="' + esc(row.thumbnailUrl || '') + '">' +
        '</div>' +
        '<div class="grid">' +
          field('Restaurant name', 'restaurantName', row.restaurantName || '') +
          field('Location (city, state or full address) — editing this and saving moves the pin', 'normalizedLocation', row.normalizedLocation || row.locationHint || '') +
          field('Website', 'website', row.website || '') +
          field('Yelp URL', 'yelpUrl', row.yelpUrl || '') +
          field('Menu URL', 'menuUrl', row.menuUrl || '') +
          field('Grubhub URL', 'grubhubUrl', row.grubhubUrl || '') +
          field('Uber Eats URL', 'uberEatsUrl', row.uberEatsUrl || '') +
          field('Video date', 'videoDate', row.videoDate || '') +
        '</div>' +
        field('Must-try quote', 'quote', row.quote || '', 'textarea') +
        '<div class="actions">' +
          '<button class="btn-primary" data-action="approve">' + (isPublished ? 'Save changes' : 'Approve &amp; publish') + '</button>' +
          '<span class="status-msg"></span>' +
        '</div>' +
      '</div>';

    function fmtDate(d){
      if (!d) return 'no date yet';
      var dt = new Date(d);
      return isNaN(dt) ? d : dt.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
    }

    card.querySelector('[data-action="toggle"]').addEventListener('click', function(){
      card.classList.toggle('expanded');
    });
    card.querySelector('[data-action="approve"]').addEventListener('click', function(e){
      e.stopPropagation();
      approve(row.id, card, isPublished);
    });
    return card;
  }

  function approve(id, card, wasAlreadyPublished){
    var btn = card.querySelector('[data-action="approve"]');
    var status = card.querySelector('.status-msg');
    var payload = { id: id };
    card.querySelectorAll('[data-field]').forEach(function(el){
      payload[el.getAttribute('data-field')] = el.value;
    });

    btn.disabled = true;
    status.className = 'status-msg';
    status.textContent = wasAlreadyPublished ? 'Saving…' : 'Publishing…';

    submitApproval(payload).then(function(res){
      btn.disabled = false;
      if (res.ok) {
        status.className = 'status-msg ok';
        if (wasAlreadyPublished) {
          status.textContent = 'Saved — the live map will update shortly.';
        } else {
          status.textContent = 'Published — removing from queue…';
          setTimeout(function(){ card.remove(); }, 900);
        }
      } else {
        status.className = 'status-msg err';
        status.textContent = res.message || 'Something went wrong — check the details and try again.';
      }
    });
  }
})();
</script>
</body>
</html>
